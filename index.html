
<!-- MINI GAME SECTION -->
<section id="game">
    <div class="container">
        <div class="section-label">BONUS / TAKE A BREAK</div>
        <h2 class="section-title">A little game break. 🎮</h2>
        <p class="section-description">
            Take a break from exploring my portfolio.
            Eat some emojis, grow your snake, and beat your high score!
        </p>

        <div class="game-wrapper">
            <div class="game-header">
                <div>
                    <span class="game-label">YOUR SCORE</span>
                    <div class="game-score" id="score">0</div>
                </div>
                <div class="best-score">
                    <span class="game-label">BEST SCORE</span>
                    <div class="game-score" id="best">0</div>
                </div>
            </div>

            <div class="game-board" id="gameBoard">
                <canvas id="snakeCanvas" width="500" height="500"></canvas>
                <div class="game-overlay" id="overlay">
                    <div class="overlay-content">
                        <div class="game-emoji">🐍</div>
                        <h3 id="overlayTitle">Emoji Snake</h3>
                        <p id="overlayText">
                            Eat random emojis and grow your snake!
                        </p>
                        <button id="startBtn" class="game-btn">
                            Start Playing
                        </button>
                    </div>
                </div>
            </div>

            <div class="game-controls">
                <span>⌨️ Arrow Keys / WASD</span>
                <span>Space to Pause</span>
            </div>

            <div class="mobile-controls">
                <button data-dir="up">↑</button>
                <div>
                    <button data-dir="left">←</button>
                    <button data-dir="down">↓</button>
                    <button data-dir="right">→</button>
                </div>
            </div>

            <button id="restartBtn" class="restart-btn">
                ↻ Restart Game
            </button>
        </div>
    </div>
</section>
