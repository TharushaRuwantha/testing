
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emoji Snake Game | Tharusha</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #090b10;
    --surface: #11151e;
    --text: #f4f5f7;
    --muted: #9299a8;
    --accent: #8b9cff;
    --border: rgba(255,255,255,.09);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
}

.game-container {
    width: 100%;
    max-width: 620px;
}

.game-intro {
    text-align: center;
    margin-bottom: 30px;
}

.eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
}

.game-intro h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(35px, 8vw, 55px);
    letter-spacing: -2px;
    margin: 12px 0;
}

.game-intro h1 span {
    color: var(--accent);
}

.game-intro p {
    color: var(--muted);
    font-size: 14px;
}

.game-card {
    background: var(--surface);
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 16px;
}

.scoreboard {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.scoreboard span {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
}

.scoreboard h2 {
    font-family: 'Space Grotesk';
    font-size: 30px;
    color: var(--accent);
}

.best-score {
    text-align: right;
}

.game-board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    border: 1px solid #30384b;
    border-radius: 10px;
    background-color: #0a0e17;

    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);

    background-size: 5% 5%;
}

#snakeCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

.game-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    background: rgba(9,11,16,.88);
    backdrop-filter: blur(5px);
}

.game-overlay.hidden {
    display: none;
}

.game-emoji {
    font-size: 60px;
    margin-bottom: 10px;
}

.overlay-content h2 {
    font-family: 'Space Grotesk';
    font-size: 27px;
    margin-bottom: 10px;
}

.overlay-content p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 22px;
}

#startBtn {
    border: none;
    padding: 13px 25px;
    border-radius: 7px;
    background: var(--accent);
    color: #090b10;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

#startBtn:hover {
    background: #aebaff;
    transform: translateY(-2px);
}

.game-instructions {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    padding: 18px 0;
}

.restart-btn {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1px solid #343b4c;
    color: white;
    border-radius: 7px;
    cursor: pointer;
    transition: .2s;
}

.restart-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.mobile-controls {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    margin: 12px 0 18px;
}

.horizontal-controls {
    display: flex;
    gap: 7px;
}

.mobile-controls button {
    width: 48px;
    height: 43px;
    background: #1c2331;
    border: 1px solid #343b4c;
    border-radius: 8px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    touch-action: manipulation;
}

.mobile-controls button:active {
    background: var(--accent);
    color: #090b10;
}

footer {
    text-align: center;
    color: #707888;
    font-size: 11px;
    padding: 25px 0;
}

@media(max-width: 600px) {
    .game-card {
        padding: 14px;
    }

    .mobile-controls {
        display: flex;
    }

    .game-instructions {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<main class="game-container">

    <header class="game-intro">
        <span class="eyebrow">A LITTLE GAME BREAK</span>

        <h1>Emoji <span>Snake.</span> 🐍</h1>

        <p>
            Eat random emojis, grow your snake,
            and beat your highest score!
        </p>
    </header>

    <div class="game-card">

        <div class="scoreboard">
            <div>
                <span>YOUR SCORE</span>
                <h2 id="score">0</h2>
            </div>

            <div class="best-score">
                <span>BEST SCORE</span>
                <h2 id="best">0</h2>
            </div>
        </div>

        <div class="game-board">

            <canvas id="snakeCanvas" width="500" height="500">
            </canvas>

            <div class="game-overlay" id="overlay">

                <div class="overlay-content">

                    <div class="game-emoji">🐍</div>

                    <h2 id="overlayTitle">Emoji Snake</h2>

                    <p id="overlayText">
                        Eat random emojis and grow your snake!
                    </p>

                    <button id="startBtn">
                        Start Playing
                    </button>

                </div>

            </div>
        </div>

        <div class="game-instructions">
            <span>⌨️ Arrow Keys / WASD</span>
            <span>SPACE to Pause</span>
        </div>

        <div class="mobile-controls">

            <button data-dir="up">↑</button>

            <div class="horizontal-controls">
                <button data-dir="left">←</button>
                <button data-dir="down">↓</button>
                <button data-dir="right">→</button>
            </div>

        </div>

        <button id="restartBtn" class="restart-btn">
            ↻ Restart Game
        </button>

    </div>

    <footer>
        Designed for Tharusha's Portfolio © 2026
    </footer>

</main>

<script>
(() => {
    "use strict";

    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");

    const scoreDisplay = document.getElementById("score");
    const bestDisplay = document.getElementById("best");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const startBtn = document.getElementById("startBtn");

    const SIZE = 20;
    const CELL = canvas.width / SIZE;

    const EMOJIS = [
        "🍕", "🍔", "🍩", "🍎", "🍓",
        "🍉", "🍌", "🍇", "🍒", "🍪",
        "🍰", "🥑", "🌮", "🍟", "🍍",
        "🥝", "🍦", "🍭", "🍫", "🧁",
        "💎", "⭐", "🚀", "❤️", "🎁"
    ];

    let snake = [];
    let food = null;

    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };

    let score = 0;
    let best = Number(localStorage.getItem("snakeBest") || 0);

    let running = false;
    let gameOver = false;

    let loop = null;
    let speed = 130;

    bestDisplay.textContent = best;

    // Generate random food
    function randomFood() {
        let position;

        do {
            position = {
                x: Math.floor(Math.random() * SIZE),
                y: Math.floor(Math.random() * SIZE),
                emoji: EMOJIS[
                    Math.floor(Math.random() * EMOJIS.length)
                ]
            };

        } while (
            snake.some(segment =>
                segment.x === position.x &&
                segment.y === position.y
            )
        );

        return position;
    }

    // Initialize game
    function resetGame() {
        clearInterval(loop);

        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };

        score = 0;
        speed = 130;

        running = false;
        gameOver = false;

        scoreDisplay.textContent = score;

        food = randomFood();

        draw();
    }

    // Start game
    function startGame() {
        if (running) return;

        if (gameOver) {
            resetGame();
        }

        running = true;
        overlay.classList.add("hidden");

        clearInterval(loop);
        loop = setInterval(update, speed);
    }

    // Pause game
    function pauseGame() {
        if (!running) return;

        running = false;
        clearInterval(loop);

        overlayTitle.textContent = "Game Paused";
        overlayText.textContent = "Ready to continue?";
        startBtn.textContent = "Resume Game";

        overlay.classList.remove("hidden");
    }

    // Change direction
    function changeDirection(dir) {
        if (gameOver) return;

        const directions = {
            up: { x: 0, y: -1 },
            down: { x: 0, y: 1 },
            left: { x: -1, y: 0 },
            right: { x: 1, y: 0 }
        };

        const newDir = directions[dir];

        if (!newDir) return;

        if (
            newDir.x + direction.x === 0 &&
            newDir.y + direction.y === 0
        ) return;

        nextDirection = newDir;

        if (!running) {
            startGame();
        }
    }

    // Main game loop
    function update() {
        direction = nextDirection;

        const head = {
            x: snake[0].x + direction.x,
            y: snake[0].y + direction.y
        };

        const eating =
            head.x === food.x &&
            head.y === food.y;

        const body = eating ? snake : snake.slice(0, -1);

        const hitWall =
            head.x < 0 ||
            head.x >= SIZE ||
            head.y < 0 ||
            head.y >= SIZE;

        const hitSnake = body.some(segment =>
            segment.x === head.x &&
            segment.y === head.y
        );

        if (hitWall || hitSnake) {
            endGame();
            return;
        }

        snake.unshift(head);

        if (eating) {
            score += 10;

            scoreDisplay.textContent = score;

            if (score > best) {
                best = score;
                bestDisplay.textContent = best;

                localStorage.setItem("snakeBest", best);
            }

            food = randomFood();

            const newSpeed = Math.max(
                65,
                130 - Math.floor(score / 50) * 8
            );

            if (newSpeed !== speed) {
                speed = newSpeed;

                clearInterval(loop);
                loop = setInterval(update, speed);
            }

        } else {
            snake.pop();
        }

        draw();
    }

    // Draw game
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw emoji food
        ctx.font = `${CELL * 0.85}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            food.emoji,
            food.x * CELL + CELL / 2,
            food.y * CELL + CELL / 2
        );

        // Draw snake
        snake.forEach((segment, index) => {

            const padding = 2;

            ctx.fillStyle = index === 0
                ? "#aab6ff"
                : "#7586e8";

            ctx.beginPath();

            ctx.roundRect(
                segment.x * CELL + padding,
                segment.y * CELL + padding,
                CELL - padding * 2,
                CELL - padding * 2,
                5
            );

            ctx.fill();

            // Snake eyes
            if (index === 0) {

                ctx.fillStyle = "#101522";

                const eyeX = direction.x !== 0
                    ? (direction.x > 0 ? 14 : 6)
                    : 6;

                const eyeY = direction.y !== 0
                    ? (direction.y > 0 ? 14 : 6)
                    : 6;

                ctx.beginPath();

                ctx.arc(
                    segment.x * CELL + eyeX,
                    segment.y * CELL + eyeY,
                    1.7,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        });
    }

    // Game over
    function endGame() {
        running = false;
        gameOver = true;

        clearInterval(loop);

        overlayTitle.textContent = "Game Over! 💥";

        overlayText.textContent =
            `You scored ${score} points. Can you beat it?`;

        startBtn.textContent = "Play Again";

        overlay.classList.remove("hidden");
    }

    // Keyboard controls
    document.addEventListener("keydown", event => {

        const keys = {
            ArrowUp: "up",
            ArrowDown: "down",
            ArrowLeft: "left",
            ArrowRight: "right",

            w: "up",
            W: "up",
            s: "down",
            S: "down",
            a: "left",
            A: "left",
            d: "right",
            D: "right"
        };

        if (keys[event.key]) {
            event.preventDefault();
            changeDirection(keys[event.key]);
        }

        if (event.code === "Space") {
            event.preventDefault();

            if (running) {
                pauseGame();
            } else {
                startGame();
            }
        }
    });

    // Mobile controls
    document.querySelectorAll(".mobile-controls button")
        .forEach(button => {

            button.addEventListener("click", () => {
                changeDirection(button.dataset.dir);
            });

        });

    // Start button
    startBtn.addEventListener("click", startGame);

    // Restart button
    document.getElementById("restartBtn")
        .addEventListener("click", () => {

            resetGame();
            startGame();

        });

    // Initialize game
    resetGame();

})();
</script>

</body>
</html>
